# Every 15 minutes while the US market is open: fetch prices (Yahoo Finance), push them to the database (which fills
# pending paper trades and scores due predictions), save the snapshot and republish the site. No AI needed, so this
# runs in the cloud and doesn't depend on the Mac being on.
name: Update prices

on:
  schedule:
    - cron: "7,22,37,52 13-21 * * 1-5"   # UTC, off the busy :00/:15 marks (GitHub drops those under load); the job checks the NYSE calendar (digest/hours.py)
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the market is closed"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # a hung Yahoo call must not hold the shared "pages" queue (and later runs) for hours
    outputs:
      ran: ${{ steps.open.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Market open?
        id: open
        # Trading days only (weekends, NYSE holidays and 1 pm early closes come from digest/hours.py), from the open
        # until 15 minutes after the close so the closing price is captured.
        run: |
          if [ "${{ inputs.force }}" = "true" ] || python3 digest/hours.py; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "Market closed, skipping."; fi
      - uses: actions/setup-python@v5
        if: steps.open.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.open.outputs.run == 'yes'
        run: pip install jinja2 pyyaml feedparser pydantic yfinance "psycopg[binary]"
      - name: Fetch prices, update database, build site
        if: steps.open.outputs.run == 'yes'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python run.py --market-only
      - name: Save snapshot
        if: steps.open.outputs.run == 'yes'
        # The Mac's daily run may have pushed meanwhile, and it writes today's snapshot too, so a rebase can conflict.
        # Instead start from the latest main and lay this run's fresher snapshot on top; retry if someone beat us.
        run: |
          git config user.name "market-digest-bot"
          git config user.email "market-digest-bot@users.noreply.github.com"
          f="data/market/$(TZ=America/New_York date +%F).json"
          [ -f "$f" ] || { echo "No snapshot written, nothing to save."; exit 0; }
          cp "$f" "$RUNNER_TEMP/snap.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main && cp "$RUNNER_TEMP/snap.json" "$f" && git add "$f"
            git diff --cached --quiet && break
            git commit -qm "Prices $(TZ=America/New_York date '+%F %H:%M') ET [skip ci]" && git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
          git fetch -q origin main && git diff --quiet origin/main -- "$f" || { echo "Couldn't push the snapshot"; exit 1; }
      - name: Rebuild the site from everything now on main (e.g. a digest pushed during this run)
        if: steps.open.outputs.run == 'yes'
        run: python run.py --build-only
      - uses: actions/upload-pages-artifact@v3
        if: steps.open.outputs.run == 'yes'
        with:
          path: site

  # Publishing has to be its own job, after the build job has finished uploading the site.
  deploy:
    needs: prices
    if: needs.prices.outputs.ran == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
