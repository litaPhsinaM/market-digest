# The daily AI run in the cloud (scripts/daily.sh without the Mac): new podcast episodes → Gemini transcript + summary
# (checked against the transcript) → brief, hot topics, prices, quiz, audio briefing (Kokoro on CPU), forecasts →
# commit data/ → publish the site. Needs the GEMINI_API_KEY and SUPABASE_DB_URL secrets.
# Started each weekday at 5:30 am New York time by the database timer (supabase/migrations/016_daily_timer.sql);
# GitHub's own schedule below is only a backup, because it has skipped runs for this repo.
name: Daily digest

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new episodes per podcast"
        default: "2"
      dry_run:
        description: "Test only: check secrets, models, voice, feeds and the build; write and publish nothing"
        type: boolean
        default: false
  schedule:
    - cron: "41 11 * * 1-5"   # backup, after the timer's run (6:41/7:41 am New York); skips itself if today's digest exists

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      ran: ${{ steps.due.outputs.run }}
    env:
      DIGEST_BACKEND: gemini
      DIGEST_TRANSCRIBE: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Due today?
        id: due
        # A manual or timer run always goes ahead; the backup schedule only runs if no digest was published today.
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "::error::Add the GEMINI_API_KEY repository secret"; exit 1; }
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/quiz/$(TZ=America/New_York date +%F).json" ]; then
            echo "Today's digest is already published, skipping."; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.due.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        if: steps.due.outputs.run == 'yes'
        # requirements.txt minus mlx-whisper (Apple only; Gemini transcribes here), plus Kokoro's CPU (ONNX) build.
        run: |
          grep -v '^mlx' requirements.txt > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt" kokoro-onnx==0.6.1
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg; }
      - name: Cache the voice model
        if: steps.due.outputs.run == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-onnx-v1.0
      - name: Download the voice model
        if: steps.due.outputs.run == 'yes'
        continue-on-error: true   # without it the audio briefing is skipped; the rest of the digest still runs
        run: |
          mkdir -p ~/.cache/kokoro && cd ~/.cache/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s "$f" ] || curl -fsSL --retry 3 -o "$f" "$base/$f"
          done
          sha256sum -c - <<'EOF' || { rm -f kokoro-v1.0.onnx voices-v1.0.bin; exit 1; }
          7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  kokoro-v1.0.onnx
          bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin
          EOF
      - name: Preflight (dry run only)
        if: steps.due.outputs.run == 'yes' && inputs.dry_run == true
        run: python scripts/preflight.py
      - name: New episodes, brief, hot topics, prices, quiz, audio
        if: steps.due.outputs.run == 'yes' && inputs.dry_run != true
        timeout-minutes: 32   # no new episode is started after 22 min, so the brief, quiz and audio still get written
        run: python run.py --limit "${{ inputs.limit || '2' }}" --max-minutes 22
      - name: Forecasts for the Scorecard
        if: steps.due.outputs.run == 'yes' && inputs.dry_run != true && !cancelled()
        timeout-minutes: 5
        run: python run.py --claims
      - name: Save data
        if: steps.due.outputs.run == 'yes' && inputs.dry_run != true && !cancelled()
        # Like prices.yml: the price job may have pushed meanwhile, so start from the latest main, lay this run's files
        # on top (its copy wins) and retry if someone beat us to it. Also saved after a failed step, so finished
        # episodes aren't summarized again (that would spend the day's free quota twice).
        run: |
          git config user.name "market-digest-bot"
          git config user.email "market-digest-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && { echo "Nothing new to save."; exit 0; }
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          git diff --cached --no-renames --name-only --diff-filter=D > "$RUNNER_TEMP/deleted.txt"
          git diff --cached --no-renames --name-only --diff-filter=d -z | xargs -0 -r cp --parents -t "$out"
          msg="Daily digest $(TZ=America/New_York date +%F) (cloud) [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main && cp -a "$out/." .
            xargs -r git rm -q --ignore-unmatch -- < "$RUNNER_TEMP/deleted.txt"
            git add -A data
            git diff --cached --quiet && break
            git commit -qm "$msg" && git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
          git fetch -q origin main && git merge-base --is-ancestor HEAD origin/main || { echo "Couldn't push the digest"; exit 1; }
      - name: Rebuild the site from everything now on main
        if: steps.due.outputs.run == 'yes' && inputs.dry_run != true && !cancelled()
        run: python run.py --build-only
      - uses: actions/upload-pages-artifact@v3
        if: steps.due.outputs.run == 'yes' && inputs.dry_run != true && !cancelled()
        with:
          path: site

  # Publishing has to be its own job, after the build job has finished uploading the site.
  deploy:
    needs: digest
    if: ${{ !cancelled() && needs.digest.outputs.ran == 'yes' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
